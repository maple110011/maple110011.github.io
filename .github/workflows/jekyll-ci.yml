name: Jekyll CI

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jekyll-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 说明：仓库 Gemfile.lock 仅含 Windows 平台（x64-mingw-ucrt），Ubuntu 上
      # 无法 bundle install；且脱离 GitHub Pages 运行时环境裸跑 jekyll 会因
      # github-pages 全家桶插件的运行时假设而出错。故采用官方同款构建器
      # （与经典 Pages 构建完全一致的引擎与环境）做推送校验。
      # 彻底修法见维护手册第五节：补 x86_64-linux 平台锁后可换回 setup-ruby。

      - name: Build site (official pages builder)
        uses: actions/jekyll-build-pages@v1
        with:
          source: .
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: _site/
          retention-days: 7
